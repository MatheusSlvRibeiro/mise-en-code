name: CI

on:
  pull_request:
    branches: [preview, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run structure checks
        run: scripts/check.sh
        env:
          BASE_REF: ${{ github.base_ref }}
