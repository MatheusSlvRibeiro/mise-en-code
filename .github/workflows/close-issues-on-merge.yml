name: Close linked issues

# GitHub only auto-closes issues when a closing keyword reaches the default branch (main).
# Work lands in preview first. The squash commit keeps the PR body, so read the keyword
# from the commit message after it is pushed to preview.
on:
  push:
    branches: [preview]

permissions:
  issues: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Close issues named with a closing keyword
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # Only a line that is just "Closes #N" counts, so prose that mentions the keyword closes nothing.
          numbers=$(grep -iE '^(close[sd]?|fix(e[sd])?|resolve[sd]?):? +#[0-9]+[[:space:]]*$' <<<"$MESSAGE" | grep -oE '[0-9]+' | sort -un || true)
          status=0
          for n in $numbers; do
            gh issue close "$n" --reason completed --comment "Closed by ${COMMIT_SHA::7} (merged into preview)." || status=1
          done
          exit $status
